name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q scripts workflow.py app.py
      - name: Smoke test CLI
        run: |
          python scripts/hookscore.py "Build a useful AI workflow in 5 steps"
          python scripts/title.py "AI research tools"
          python scripts/swipe.py "AI research tools" --ideas 3
